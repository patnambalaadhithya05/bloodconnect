services:

  db:

    image: postgres:17

    environment:

      POSTGRES_DB: bloodconnect

      POSTGRES_USER: bloodconnect

      POSTGRES_PASSWORD: bloodconnect

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U bloodconnect -d bloodconnect"
        ]

      interval: 5s

      timeout: 5s

      retries: 10


  web:

    build: .

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:

      - .:/app

    ports:

      - "8000:8000"

    env_file:

      - .env

    depends_on:

      db:

        condition: service_healthy


volumes:

  postgres_data:
